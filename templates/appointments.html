{% extends "base.html" %}{% set title="Appointments" %}{% block content %}
<div class="card p-4 mb-4"><h5 class="fw-bold">Create Appointment</h5><form method="post" class="row g-3 mt-1">
<div class="col-md-4"><select class="form-select" name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></div>
<div class="col-md-4"><select class="form-select" name="doctor_id" required><option value="">Select doctor</option>{% for d in doctors %}<option value="{{d.id}}">{{d.name}} — {{d.specialization}}</option>{% endfor %}</select></div>
<div class="col-md-4"><input class="form-control" type="datetime-local" name="appointment_date" required></div>
<div class="col-12"><input class="form-control" name="notes" placeholder="Notes (optional)"></div>
<div class="col-12"><button class="btn btn-primary">Create Appointment</button></div></form></div>
<div class="card p-4"><h5 class="fw-bold">Appointment List</h5><div class="table-responsive"><table class="table mt-3"><thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th></tr></thead><tbody>{% for a in appointments %}<tr><td>{{a.patient_name}}</td><td>{{a.doctor_name}}</td><td>{{a.appointment_date}}</td><td>{{a.status}}</td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted">No appointments.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
