<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - MediCare AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{min-height:100vh;background:linear-gradient(135deg,#0f2745,#1d4ed8);display:grid;place-items:center}.box{width:420px;max-width:92%;background:white;border-radius:24px;padding:35px;box-shadow:0 20px 60px #0004}</style></head>
<body><div class="box"><div class="text-center mb-4"><div style="font-size:46px">🏥</div><h2 class="fw-bold">MediCare AI</h2><p class="text-muted">Hospital Management System</p></div>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" name="email" value="admin@hospital.local" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" value="admin123" required>
<button class="btn btn-primary w-100 py-2">Login</button></form>
<p class="small text-muted mt-4 mb-0">Demo credentials are included for local testing only.</p></div></body></html>
